<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="#0d1b3e"/>

  <!-- Subtle radial glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#7c4fe0" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#0d1b3e" stop-opacity="0"/>
  </radialGradient>
  <rect width="1024" height="1024" rx="220" fill="url(#glow)"/>

  <!-- D letter — display wordmark style -->
  <text
    x="512" y="600"
    font-family="'Arial Black', sans-serif"
    font-weight="900"
    font-size="540"
    text-anchor="middle"
    fill="#7c4fe0"
    letter-spacing="-20"
    opacity="0.15"
  >D</text>

  <!-- Route path — mimics the teal route line in the reference -->
  <path
    d="M 340 720 L 340 480 Q 340 380 440 340 L 620 340"
    stroke="#2edbb0"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Pickup dot — purple -->
  <circle cx="340" cy="720" r="32" fill="#7c4fe0"/>
  <circle cx="340" cy="720" r="18" fill="#fff"/>

  <!-- Arrow head at destination -->
  <circle cx="620" cy="340" r="32" fill="#2edbb0"/>
  <circle cx="620" cy="340" r="18" fill="#fff"/>

  <!-- Wordmark -->
  <text
    x="512" y="900"
    font-family="'Arial Black', sans-serif"
    font-weight="900"
    font-size="112"
    text-anchor="middle"
    fill="#f0eeff"
    letter-spacing="18"
  >DISPATCH</text>
</svg>
